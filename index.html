<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Staff Direct - طلب توظيف</title> 
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"> 
<style> 
:root { --navy: #0A1F44; --gold: #D4AF37; --light-gold: #F5E6C8; --white: #ffffff; } 
* {box-sizing: border-box; margin: 0; padding: 0;} 
body { background: linear-gradient(135deg, var(--navy) 0%, #1a3a6e 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; font-family: 'Cairo', sans-serif;} 
.apply-box { background: var(--white); width: 100%; max-width: 600px; padding: 40px 30px; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.3); border-top: 5px solid var(--gold); } 
.logo-wrap {display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;} 
.logo-icon { width: 50px; height: 50px; background: var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--navy); font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; } 
.logo-text {font-size: 28px; font-weight: 700; color: var(--navy);} 
.tag {color: var(--gold); font-size: 12px; font-weight: 600; margin-bottom: 25px; text-align: center; text-transform: uppercase;} 
h2 {font-size: 24px; font-weight: 700; color: var(--navy); text-align: center; margin-bottom: 8px;} 
p.sub {color: #555; font-size: 14px; text-align: center; margin-bottom: 30px;} 

.form-group {margin-bottom: 20px; text-align: right;} 
label {display: block; font-weight: 600; color: var(--navy); margin-bottom: 8px; font-size: 14px;} 
input, select {width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 15px; transition: 0.3s;} 
input:focus, select:focus {border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(212,175,55,0.2);} 

.btn-apply { 
background: linear-gradient(135deg, var(--gold) 0%, #B8860B 100%); 
color: var(--navy); 
padding: 14px; 
width: 100%; 
border: none; 
border-radius: 8px; 
font-size: 18px; 
font-weight: 700; 
font-family: 'Cairo', sans-serif; 
cursor: pointer; 
margin-top: 10px; 
transition: all 0.3s ease; 
}
.btn-apply:hover {transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,175,55,0.4);} 
.btn-apply:disabled {background: #ccc; cursor: not-allowed;}

.success {background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; text-align: center; margin-top: 15px; display: none; border: 1px solid #c3e6cb;}
.error {background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; text-align: center; margin-top: 15px; display: none; border: 1px solid #f5c6cb;}
</style> 
</head> 
<body> 
<div class="apply-box"> 
<div class="logo-wrap">
