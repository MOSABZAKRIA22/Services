label {display: block; color: var(--navy); font-weight: 600; font-size: 14px; margin-bottom: 6px;}

.btn {width: 100%; padding: 16px; background: linear-gradient(135deg, var(--gold) 0%, #B8860B 100%); color: var(--navy); border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 10px;}
.btn:hover {transform: translateY(-2px);}
</style> 
</head>
