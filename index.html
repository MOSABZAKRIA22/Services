<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Staff Direct - توظيف</title> 
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"> 
<style> 
:root { --navy: #0A1F44; --gold: #D4AF37; --light-gold: #F5E6C8; --white: #ffffff; } 
* {box-sizing: border-box;} 
body { background: linear-gradient(135deg, var(--navy) 0%, #1a3a6e 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; font-family: 'Cairo', sans-serif;} 
.apply-box { background: var(--white); width: 100%; max-width: 680px; padding: 40px 30px; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.3); text-align: center; border-top: 5px solid var(--gold); } 
.logo-wrap {display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;} 
.logo-icon { width: 45px; height: 45px; background: var(--gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--navy); font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; } 
.logo-text {font-size: 26px; font-weight: 700; color: var(--navy); letter-spacing: 1px;} 
.tag {color: var(--gold); font-size: 12px; font-weight: 600; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;} 
h2 {font-size: 22px; font-weight: 700; color: var(--navy); margin: 5px 0 8px;} 
p.sub {color: #555; font-size: 14px; margin-bottom: 25px;} 
.note {background: var(--light-gold); padding: 12px; border-radius: 8px; font-size: 12px; color: var(--navy); margin-bottom: 20px; border-right: 4px solid var(--gold); font-weight: 500;} 
iframe {width: 100%; height: 1174px; border: none; border-radius: 8px;} 
.footer {margin-top: 20px; font-size: 11px; color: #777;} 
@media (max-width: 600px) { .apply-box {padding: 25px 15px;} iframe {height: 1200px;} }
</style> 
</head> 
<body> 
<div class="apply-box"> 
<div class="logo-wrap"> <div class="logo-icon">SD</div> <div class="logo-text">STAFF DIRECT</div> </div> 
<div class="tag">Premium Hospitality Recruitment</div> 
<h2>استمارة توظيف الموظفات</h2> 
<p class="sub">وظائف الفنادق والسياحة في لندن</p> 
<div class="note">✓ للسيدات فقط | العمر 20-45 | يشترط تصريح عمل في المملكة المتحدة</div> 

<!-- الفورم بتاعك هنا -->
<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf..." width="640" height="1174" frameborder="0" marginheight="0" marginwidth="0">جارٍ التحميل…</iframe>

<div class="footer">© 2026 Staff Direct Ltd. | London, UK</div> 
</div> 
</body> 
</html>
